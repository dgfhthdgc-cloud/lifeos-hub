<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary App Metadata -->
    <title>LIFE OS - Intelligent Personal Operating System</title>
    <meta name="description" content="Your intelligent personal operating system integrating planning, goals, habits, learning, trading, AI coaching, and gamification." />
    <meta name="application-name" content="LIFE OS" />
    
    <!-- PWA Manifest & Standard Favicons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- PWA / Mobile Browser Theming & Standalone Configuration -->
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LIFE OS" />
    <meta name="msapplication-TileColor" content="#090d16" />
    <meta name="msapplication-TileImage" content="/icons/icon-192x192.png" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="LIFE OS - Intelligent Personal Operating System" />
    <meta property="og:description" content="Your intelligent personal operating system." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LIFE OS" />
    <meta name="twitter:description" content="Your intelligent personal operating system." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <!-- Theme Initialization Script (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('life_os_theme_mode') || 'dark';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-50 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
